apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: interview-assistant
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-assistant
      component: backend
  template:
    metadata:
      labels:
        app: interview-assistant
        component: backend
    spec:
      containers:
      - name: backend
        image: your_dockerhub_username/interview-assistant-backend:IMAGE_TAG
        ports:
        - containerPort: 5000
        env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: interview-assistant-secrets
              key: GOOGLE_API_KEY
        - name: MURF_API_KEY
          valueFrom:
            secretKeyRef:
              name: interview-assistant-secrets
              key: MURF_API_KEY
        - name: ASSEMBLYAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: interview-assistant-secrets
              key: ASSEMBLYAI_API_KEY
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: interview-assistant
    component: backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP
