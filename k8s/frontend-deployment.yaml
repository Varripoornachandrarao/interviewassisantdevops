apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: interview-assistant
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-assistant
      component: frontend
  template:
    metadata:
      labels:
        app: interview-assistant
        component: frontend
    spec:
      containers:
      - name: frontend
        image: your_dockerhub_username/interview-assistant-frontend:IMAGE_TAG
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: interview-assistant
    component: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
