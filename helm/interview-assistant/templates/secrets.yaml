apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interview-assistant.fullname" . }}-secrets
type: Opaque
data:
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | b64enc | quote }}
  MURF_API_KEY: {{ .Values.secrets.murfApiKey | b64enc | quote }}
  ASSEMBLYAI_API_KEY: {{ .Values.secrets.assemblyaiApiKey | b64enc | quote }}
