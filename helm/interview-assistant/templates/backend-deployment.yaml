apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interview-assistant.fullname" . }}-backend
  labels:
    {{- include "interview-assistant.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "interview-assistant.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "interview-assistant.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      containers:
      - name: backend
        image: "{{ .Values.image.repository }}-backend:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 5000
        env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "interview-assistant.fullname" . }}-secrets
              key: GOOGLE_API_KEY
        - name: MURF_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "interview-assistant.fullname" . }}-secrets
              key: MURF_API_KEY
        - name: ASSEMBLYAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "interview-assistant.fullname" . }}-secrets
              key: ASSEMBLYAI_API_KEY
        - name: REDIS_URL
          value: "redis://{{ include "interview-assistant.fullname" . }}-redis:6379"
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "interview-assistant.fullname" . }}-backend
spec:
  selector:
    {{- include "interview-assistant.selectorLabels" . | nindent 4 }}
    component: backend
  ports:
  - protocol: TCP
    port: {{ .Values.backend.service.port }}
    targetPort: 5000
  type: {{ .Values.backend.service.type }}
