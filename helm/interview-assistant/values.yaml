replicaCount: 2

image:
  repository: your_dockerhub_username/interview-assistant
  pullPolicy: IfNotPresent
  tag: "latest"

backend:
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

redis:
  enabled: true
  image: redis:alpine

secrets:
  googleApiKey: ""
  murfApiKey: ""
  assemblyaiApiKey: ""
